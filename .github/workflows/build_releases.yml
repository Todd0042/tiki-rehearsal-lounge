name: Automated Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0, leave empty to read from git/tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish release assets to GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Universal Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Determine Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            V="$INPUT_VER"
          elif [[ "$RAW_TAG" =~ ^v[0-9] ]]; then
            V="${RAW_TAG#v}"
          else
            V="1.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Executable Permissions
        run: |
          chmod +x build_appimage.sh

      - name: Compile Universal AppImage
        env:
          STUDIO_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./build_appimage.sh

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rehearsal-appimage
          path: dist/*.AppImage
          retention-days: 7

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-linux-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    steps:
      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-rehearsal-appimage
          path: release_assets/

      - name: Determine Release Tag
        id: rel_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          name: 🌺 Tiki Rehearsal Lounge ${{ steps.rel_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
