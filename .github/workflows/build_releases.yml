name: Automated Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0, leave empty to read from git/tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish release assets to GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Universal Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Determine Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            V="$INPUT_VER"
          elif [[ "$RAW_TAG" =~ ^v[0-9] ]]; then
            V="${RAW_TAG#v}"
          else
            V="1.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure Executable Permissions
        run: |
          chmod +x build_appimage.sh

      - name: Compile Universal AppImage
        env:
          STUDIO_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./build_appimage.sh

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-rehearsal-appimage
          path: dist/*.AppImage
          retention-days: 7

  build-windows:
    name: Build Windows Standalone & Installer
    runs-on: windows-latest

    steps:
      - name: Determine Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            V="$INPUT_VER"
          elif [[ "$RAW_TAG" =~ ^v[0-9] ]]; then
            V="${RAW_TAG#v}"
          else
            V="1.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build Windows Standalone & Installer
        shell: powershell
        run: |
          & packaging\windows\build_windows.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-rehearsal-installer
          path: packaging/windows/dist_installer/*.exe
          retention-days: 7

      - name: Upload Windows Portable Zip Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-rehearsal-portable
          path: packaging/windows/dist/*.zip
          retention-days: 7

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-linux-appimage, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release_assets/

      - name: Consolidate Release Assets
        shell: bash
        run: |
          mkdir -p final_assets/
          find release_assets/ -type f \( -name "*.AppImage" -o -name "*.exe" -o -name "*.zip" \) -exec cp -v {} final_assets/ \;
          ls -la final_assets/

      - name: Determine Release Tag
        id: rel_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          name: 🌺 Tiki Rehearsal Lounge ${{ steps.rel_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final_assets/*

  itch-deploy:
    name: Deploy to Itch.io (Butler)
    needs: [build-linux-appimage, build-windows, publish-github-release]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - name: Check Butler Credentials
        id: check_auth
        shell: bash
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::notice ::BUTLER_API_KEY secret is not set. Skipping Itch.io deployment."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download All Artifacts
        if: steps.check_auth.outputs.has_key == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: itch_artifacts/

      - name: Install Butler
        if: steps.check_auth.outputs.has_key == 'true'
        shell: bash
        run: |
          curl -L -A "Mozilla/5.0" -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          sudo unzip -o butler.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/butler
          rm -f butler.zip
          butler -V

      - name: Push to Itch.io Channels
        if: steps.check_auth.outputs.has_key == 'true'
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            REL_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            RAW_TAG="${{ github.ref_name }}"
            REL_VER="${RAW_TAG#v}"
          else
            REL_VER="${{ github.ref_name }}"
          fi

          echo "=========================================================="
          echo "Deploying Tiki Rehearsal Lounge v$REL_VER to Itch.io"
          echo "Target Page: todd0042/tiki-karaoke-lounge"
          echo "=========================================================="

          # 1. Linux AppImage
          for f in $(find itch_artifacts/ -name "*.AppImage"); do
            echo "Pushing Linux AppImage: $f"
            butler push "$f" todd0042/tiki-karaoke-lounge:rehearsal-linux --userversion "$REL_VER"
          done

          # 2. Windows Turnkey Installer (.exe)
          for f in $(find itch_artifacts/ -name "*Setup*.exe"); do
            echo "Pushing Windows Installer: $f"
            butler push "$f" todd0042/tiki-karaoke-lounge:rehearsal-windows --userversion "$REL_VER"
          done

          # 3. Windows Portable (.zip)
          for f in $(find itch_artifacts/ -name "*Portable*.zip"); do
            echo "Pushing Windows Portable: $f"
            butler push "$f" todd0042/tiki-karaoke-lounge:rehearsal-windows-portable --userversion "$REL_VER"
          done

          echo "✅ All Itch.io deployments completed successfully!"
